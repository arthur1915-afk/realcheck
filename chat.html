<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#081321"><title>Private chat — REALCHECK</title><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="stylesheet" href="styles.css"></head>
<body class="account-page"><header class="topbar"><a class="brand" href="./"><span class="brand-mark">R</span> REAL<span>CHECK</span></a><div class="top-actions"><a class="btn btn-quiet" href="./messages.html">All messages</a><a class="btn btn-quiet" href="./connections.html">Connections</a></div></header>
<main class="account-main chat-main"><section class="account-card chat-card"><div class="chat-header"><a href="./messages.html" aria-label="Back to messages">←</a><div><div class="eyebrow">PRIVATE CONVERSATION</div><h1 id="chatMemberName">Loading chat…</h1><p id="chatMemberUsername"></p></div></div><p id="chatStatus" class="form-message" aria-live="polite"></p><div id="chatMessages" class="chat-messages" aria-live="polite"></div><form id="chatForm" class="chat-compose"><textarea id="messageInput" rows="2" maxlength="5000" placeholder="Write a message…" required></textarea><button id="sendMessageBtn" class="btn btn-primary" type="submit">Send</button></form><p class="chat-footnote">Only you and this accepted connection can access this conversation. Keep personal information safe.</p></section></main>
